# The formal-companion annotation format as an installable package: the JSON
# Schema, the checker and its console script, the id rules and the vocabulary.
# Standard library only at run time; the tests use jsonschema when it is there.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-companion-annotations"
version = "1.0.0rc2"                     # kept in step with src/formal_companion_annotations/__init__.py
description = "The formal-companion annotation format: which Lean declarations formalise which items of which sources, with a standard-library validator."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "the formal-companion contributors" }]
keywords = ["lean4", "mathlib", "formalization", "annotation", "json-schema", "web-annotation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/mathlib-initiative/formal-companion-annotations"
Issues = "https://github.com/mathlib-initiative/formal-companion-annotations/issues"
Changelog = "https://github.com/mathlib-initiative/formal-companion-annotations/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]
jsonschema = ["jsonschema>=4.18"]

[project.scripts]
formal-companion-annotations-validate = "formal_companion_annotations.validate:main"

[tool.setuptools]
# The one schema file lives in schema/; the wheel ships that directory as the
# package's schema/ (validate.SCHEMA_DIR), so there is no second copy.
packages = ["formal_companion_annotations", "formal_companion_annotations.schema"]
package-dir = { "" = "src", "formal_companion_annotations.schema" = "schema" }

[tool.setuptools.package-data]
formal_companion_annotations = ["py.typed"]
"formal_companion_annotations.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
