[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-companion-annotations"
version = "2.0.0a2"  # Kept in step with the package's __version__.
description = "Single formal/informal annotations for PDF, LaTeX, HTML and generic input, with offline shard discovery."
readme = "README.md"
# The test suite requires Python 3.11 or newer (tomllib).
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Formal Companion Annotations contributors" }]
keywords = ["lean4", "mathlib", "formalization", "annotation", "json-schema"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []  # Validation and discovery use only the standard library.

[project.urls]
Source = "https://github.com/mathlib-initiative/formal-companion-annotations"
Issues = "https://github.com/mathlib-initiative/formal-companion-annotations/issues"
Changelog = "https://github.com/mathlib-initiative/formal-companion-annotations/blob/main/CHANGELOG.md"

[project.scripts]
formal-companion-annotations = "formal_companion_annotations.cli:main"

[tool.setuptools]
# One source copy of the schema; installed wheels carry it inside the package.
packages = ["formal_companion_annotations", "formal_companion_annotations.schema"]
package-dir = { "" = "src", "formal_companion_annotations.schema" = "schema" }

[tool.setuptools.package-data]
# py.typed: the public API is fully annotated (tests/test_public_api.py checks it).
formal_companion_annotations = ["py.typed"]
"formal_companion_annotations.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
