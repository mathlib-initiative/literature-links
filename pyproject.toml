[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-links"
dynamic = ["version"]
description = "A small JSON format that records correspondences between mathematical documents, such as a book passage and a Lean declaration."
readme = "README.md"
# The test suite requires Python 3.11 or newer (tomllib).
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "the Literature Links contributors" }]
keywords = ["lean4", "mathlib", "formalization", "annotation", "json-schema"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = []  # Validation and discovery use only the standard library.

[project.urls]
Documentation = "https://mathlib-initiative.github.io/literature-links/"
Source = "https://github.com/mathlib-initiative/literature-links"
Issues = "https://github.com/mathlib-initiative/literature-links/issues"
Changelog = "https://github.com/mathlib-initiative/literature-links/blob/main/CHANGELOG.md"

[project.scripts]
literature-links = "literature_links.cli:main"

[tool.setuptools]
# One source copy of the schema; installed wheels carry it inside the package.
packages = ["literature_links", "literature_links.schema"]
package-dir = { "" = "src", "literature_links.schema" = "schema" }

[tool.setuptools.dynamic]
version = { attr = "literature_links.__version__" }

[tool.setuptools.package-data]
# py.typed: the public API is fully annotated (tests/test_public_api.py checks it).
literature_links = ["py.typed"]
"literature_links.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
