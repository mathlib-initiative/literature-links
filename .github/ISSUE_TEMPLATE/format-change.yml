name: Format change proposal
description: Propose a change to the annotation format (a key, a value, a rule, an invariant, an id rule, a profile).
title: "[format] "
labels: ["format"]
body:
  - type: markdown
    attributes:
      value: |
        A change to the format changes what every producer may write and every reader must accept. Say what needs it, show a document, and classify the change (CONTRIBUTING.md, "Minor or major").
  - type: textarea
    id: need
    attributes:
      label: What a producer or reader needs
      description: Who needs this, and what they cannot express or read today.
    validations:
      required: true
  - type: textarea
    id: document
    attributes:
      label: A document that needs it
      description: A small synthetic document (no text from a real source) showing the change. Mark which part is new.
      render: json
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Minor (only adds an optional key, a value, a lint, a profile)
        - Major (removes, renames, makes required, changes a meaning, a canonical or an id rule)
        - Patch (the checker or the docs, no rule changes)
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - core
        - graph profile
        - site profile
        - audit profile
        - history profile
        - checker or CLI only
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Could an `x_` extension key, an existing field or an existing profile carry this instead?
