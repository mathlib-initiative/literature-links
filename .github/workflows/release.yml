# Publish a tagged release to PyPI through trusted publishing (OIDC).
#
# Nothing is stored in the repository: PyPI is told, once, that releases of
# the project `formal-companion-annotations` come from this repository's
# `release` workflow in the `pypi` environment (Publishing -> Add a new
# pending publisher on pypi.org). After that, pushing an annotated tag
# vX.Y.Z or vX.Y.ZrcN builds the sdist and wheel from the tag, checks that
# the tag and the package agree on the version, runs the suite against the
# built wheel, and uploads.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine pytest
      - name: the tag is the package's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c 'import re, pathlib; print(re.search(r"^__version__ = \"([^\"]+)\"", pathlib.Path("src/formal_companion_annotations/__init__.py").read_text(), re.M).group(1))')
          test "$tag" = "$version" || { echo "tag v$tag but the package says $version"; exit 1; }
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the suite passes against the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q
        env:
          FORMAL_COMPANION_ANNOTATIONS_TEST_INSTALLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
