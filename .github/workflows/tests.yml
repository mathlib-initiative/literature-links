name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: source / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # The independent evaluator is test-only; no package/runtime install is needed.
      - if: matrix.python == '3.13'
        run: python -m pip install jsonschema
      - run: python -m pytest -q

  stdlib:
    name: standard library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests

  platform-smoke:
    name: CLI and discovery / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install . pytest
      - run: python -m pytest -q -rs tests/test_cli.py tests/test_discovery.py

  installed:
    name: installed / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Non-editable: test the wheel, including both packaged schemas and py.typed.
      - run: python -m pip install . pytest
      - name: Verify installed import and entry points
        run: |
          python - <<'PY'
          import subprocess, sys
          import formal_companion_annotations as package
          assert 'site-packages' in package.__file__, package.__file__
          assert not any(p.rstrip('/').endswith('/src') for p in sys.path), sys.path
          for command in ('formal-companion-annotations', 'formal-companion-annotations-validate'):
              actual = subprocess.check_output([command, '--version'], text=True)
              assert actual == f'{command} {package.__version__}\n', actual
          PY
      - run: python -m pytest -q -rs
        env:
          FORMAL_COMPANION_ANNOTATIONS_TEST_INSTALLED: '1'
      - name: Exercise installed migration and shard discovery
        run: |
          formal-companion-annotations validate examples/companion/*.json
          formal-companion-annotations migrate-v1 examples/annotations/web-passage.json --output "$RUNNER_TEMP/migration"
          formal-companion-annotations scan "$RUNNER_TEMP/migration" --include 'annotation-*.json' --format json
          cmp examples/annotations/web-passage.json "$RUNNER_TEMP/migration/original-v1.json"

  distribution:
    name: source and wheel distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine pytest
      # Build the wheel from the sdist, so missing source files fail here.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check wheel contents and schema bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          package = 'formal_companion_annotations'
          expected = {f'{package}/{p.name}' for p in Path('src', package).glob('*.py')}
          expected.add(f'{package}/py.typed')
          expected.update(f'{package}/schema/{p.name}' for p in Path('schema').glob('*.json'))
          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as archive:
              actual = {n for n in archive.namelist() if not n.split('/')[0].endswith('.dist-info')}
              assert actual == expected, (actual - expected, expected - actual)
              for source in Path('schema').glob('*.json'):
                  assert archive.read(f'{package}/schema/{source.name}') == source.read_bytes()
          PY
      - name: Test the unpacked sdist without installing the package
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/formal_companion_annotations-*/
          python -c "import importlib.util; assert importlib.util.find_spec('formal_companion_annotations') is None"
          python -m pytest -q
          python -m unittest discover -s tests
