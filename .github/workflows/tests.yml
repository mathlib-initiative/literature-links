# The test suite, the installed wheel and the distributions, on every push.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      # The jsonschema agreement tests run here; elsewhere they skip.
      - if: matrix.python-version == '3.13'
        run: python -m pip install jsonschema
      - run: python -m pytest -q

  unittest:
    name: unittest (nothing installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests

  installed:
    name: the installed wheel (console script, examples, suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - name: the console script reports the package version
        run: |
          want="formal-companion-annotations-validate $(python -c 'import formal_companion_annotations as p; print(p.__version__)')"
          test "$(formal-companion-annotations-validate --version)" = "$want"
      - name: the valid examples pass in canonical form
        run: formal-companion-annotations-validate --canonical $(ls examples/annotations/*.json | grep -v '/invalid-')
      - name: each invalid example fails with the line it records
        run: |
          for f in examples/annotations/invalid-*.json; do
            want="$f: $(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["x_expected_error"])' "$f")"
            status=0; out=$(formal-companion-annotations-validate "$f") || status=$?
            test "$status" -eq 1 && test "$out" = "$want" || { echo "$f: exit $status: $out"; exit 1; }
          done
      # The variable makes the suite assert that it tests the installed copy.
      - run: python -m pytest -q
        env:
          FORMAL_COMPANION_ANNOTATIONS_TEST_INSTALLED: "1"

  dist:
    name: sdist and wheel (build, twine check, the sdist's own tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the wheel is the package and its schema, nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = sorted(n for n in zipfile.ZipFile(wheel).namelist() if ".dist-info/" not in n)
          want = sorted("formal_companion_annotations/" + n for n in (
              "__init__.py", "__main__.py", "ids.py", "py.typed", "schemacheck.py", "validate.py", "vocab.py",
              "schema/annotations-v1.0.schema.json"))
          assert names == want, names
          PY
      - name: the unpacked sdist runs its own tests with nothing installed
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/formal_companion_annotations-*/
          python -m pytest -q
          python -m unittest discover -s tests
