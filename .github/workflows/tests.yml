# The test suite and the installed console script, on every push.
#
# What it pins:
#
#   * the Python floor (3.11, pyproject.toml's requires-python) through the
#     newest release the checker is tested on;
#   * standard library only: the pytest jobs install pytest and nothing else,
#     except the 3.13 job, which also installs jsonschema so the agreement tests
#     (tests/test_annotations_schema.py, TestAgreementWithJsonschema) run
#     somewhere; everywhere else they skip, as the checker never needs it;
#   * that `unittest discover` runs the suite with nothing installed at all;
#   * that an installed wheel carries the schema as package data and its
#     console script reports the package version, accepts the valid examples
#     and rejects the invalid ones with the error each records in its own
#     `x_expected_error` key;
#   * that the suite passes against a regular (non-editable) install: the
#     tests import whatever copy Python finds and add src/ to the path only
#     when none is installed, and that job makes them assert the copy they
#     tested is the one in site-packages;
#   * that `python -m build` makes an sdist and a wheel `twine check` accepts,
#     that the wheel holds the package and its schema and nothing else, and
#     that the unpacked sdist runs its own tests (MANIFEST.in).
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - if: matrix.python-version == '3.13'
        run: python -m pip install jsonschema
      - run: python -m pytest -q

  unittest:
    name: unittest discover (nothing installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests

  installed:
    name: installed package (wheel, schema as package data, console script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # A regular (non-editable) install: src/ is not on sys.path, so every
      # step below runs the installed copy.
      - run: python -m pip install .
      - name: the packaged schema is the repository's
        run: |
          python - <<'PY'
          from pathlib import Path
          from formal_companion_annotations import companion, validate
          for module in (companion, validate):
              schema = module.SCHEMA_PATH
              assert schema.is_file(), schema
              assert "site-packages" in str(schema), schema
              assert schema.read_bytes() == (Path("schema") / schema.name).read_bytes()
              print("ok:", schema)
          PY
      - name: the console script reports the package version
        run: |
          want="formal-companion-annotations-validate $(python -c 'import formal_companion_annotations as p; print(p.__version__)')"
          got=$(formal-companion-annotations-validate --version)
          echo "$got"
          test "$got" = "$want"
      - name: valid examples pass, in canonical form
        run: |
          formal-companion-annotations-validate --canonical $(ls examples/annotations/*.json | grep -v '/invalid-')
      - name: minimal companions validate and format with the installed CLI
        run: |
          formal-companion-annotations --version
          formal-companion-annotations validate examples/companion-v2/*.json
          formal-companion-annotations format examples/companion-v2/generic-image.json --output "$RUNNER_TEMP/companion.json"
          formal-companion-annotations validate "$RUNNER_TEMP/companion.json"
          formal-companion-annotations migrate-v1 examples/annotations/web-passage.json --output "$RUNNER_TEMP/migration"
          formal-companion-annotations validate "$RUNNER_TEMP/migration/companion-001.json"
          cmp examples/annotations/web-passage.json "$RUNNER_TEMP/migration/original-v1.json"
      - name: invalid examples fail with their recorded error
        run: |
          set -u
          for f in examples/annotations/invalid-*.json; do
            want=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["x_expected_error"])' "$f")
            set +e
            out=$(formal-companion-annotations-validate "$f")
            status=$?
            set -e
            echo "$out"
            test "$status" -eq 1 || { echo "$f: exit $status, expected 1"; exit 1; }
            test "$out" = "$f: $want" || { echo "$f: unexpected output"; exit 1; }
          done

  installed-pytest:
    name: pytest against the installed package (python ${{ matrix.python-version }}, src/ not on the path)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Not `pip install -e .`: an editable install would put src/ on the path
      # and test the source tree again.
      - run: python -m pip install . pytest
      - name: the package Python imports is the installed one
        run: |
          python - <<'PY'
          import sys
          import formal_companion_annotations as p
          print(p.__file__)
          assert "site-packages" in p.__file__, p.__file__
          assert not any(entry.rstrip("/").endswith("/src") for entry in sys.path), sys.path
          PY
      # The tests find the installed copy, so they never add src/ to sys.path;
      # the variable makes test_packaging assert exactly that.
      - run: python -m pytest -q -rs
        env:
          FORMAL_COMPANION_ANNOTATIONS_TEST_INSTALLED: "1"

  dist:
    name: sdist and wheel (build, twine check, the sdist's own tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine pytest
      # build makes the sdist, then the wheel from the unpacked sdist.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: the wheel holds the package and its packaged schema, nothing else
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          package = sorted(n for n in names if not n.split("/")[0].endswith(".dist-info"))
          want = ["formal_companion_annotations/__init__.py", "formal_companion_annotations/__main__.py",
                  "formal_companion_annotations/cli.py", "formal_companion_annotations/companion.py",
                  "formal_companion_annotations/ids.py", "formal_companion_annotations/migration.py",
                  "formal_companion_annotations/py.typed",
                  "formal_companion_annotations/schema/annotations-v1.schema.json",
                  "formal_companion_annotations/schema/companion-v2.schema.json",
                  "formal_companion_annotations/schemacheck.py", "formal_companion_annotations/validate.py",
                  "formal_companion_annotations/vocab.py"]
          assert package == want, package
          print("\n".join(names))
          PY
      - name: the unpacked sdist runs its own tests, with nothing installed
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/formal_companion_annotations-*/
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('formal_companion_annotations') is not None)"
          python -m pytest -q
          python -m unittest discover -s tests
